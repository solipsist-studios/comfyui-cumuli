<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cumuli ring viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b0f10; color: #9aa; font: 13px system-ui, sans-serif; overflow: hidden; }
  #viewer { position: absolute; inset: 0; }
  #message { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; }
</style>
</head>

<div id="viewer"></div>
<div id="message">Loading the viewer&hellip;</div>
<script type="module" src="./start.js"></script>
</body>
</html>
